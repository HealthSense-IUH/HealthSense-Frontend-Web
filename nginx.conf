server {
    listen 80;
    server_name localhost;

    # Nén Gzip để load trang nhanh hơn
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Root directory nơi Nginx phục vụ file build
    root /usr/share/nginx/html;
    index index.html;

    # Không cache: index.html, các route của SPA và file trong public/ (logo, favicon, video...).
    # Trình duyệt luôn lấy bản mới sau mỗi lần deploy, không cần Ctrl+F5.
    location / {
        # Bất kỳ URL nào không phải file vật lý, đều fallback về index.html
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # try_files chuyển về /index.html thì vào đây, nên header không-cache phải đặt lại
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # JS/CSS do Vite build nằm trong /assets/ và có mã hash trong tên file (index-Bx12.js):
    # mỗi lần build tên đổi nên cache lâu vẫn không bao giờ dùng nhầm bản cũ.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Favicon route
    location = /favicon.ico {
        try_files /favicon/favicon.ico =204;
        access_log off;
        log_not_found off;
        add_header Cache-Control "no-cache" always;
    }

    # Bỏ qua access log cho health check nếu có
    location = /health {
        access_log off;
        return 200 'healthy\n';
    }
}
